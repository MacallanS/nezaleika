services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nezaleika
      POSTGRES_PASSWORD: nezaleika
      POSTGRES_DB: nezaleika
    ports:
      - "5433:5432"
    volumes:
      - nezaleika_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://nezaleika:nezaleika@db:5432/nezaleika
      ALLOWED_HOSTS: localhost,127.0.0.1,api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - nezaleika_media:/app/media
    depends_on:
      - db
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  nezaleika_pg:
  nezaleika_media:
