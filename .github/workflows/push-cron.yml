name: Watering reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API then send reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE: ${{ vars.NEZALEIKA_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE}" ]; then
            echo "NEZALEIKA_API_URL is not set" >&2
            exit 1
          fi
          API_BASE="${API_BASE%/}"
          # Wake cold instance, then run the daily reminder cron.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            "${API_BASE}/api/csrf/"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${API_BASE}/api/push/cron"
