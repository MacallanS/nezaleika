name: Watering reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API then send reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Free Render: wake with a cheap GET, then run the cron POST.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            "https://nezaleika-api.onrender.com/api/csrf/"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "https://nezaleika-api.onrender.com/api/push/cron"
