name: Watering reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scheduled push
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Free Render instances sleep; the first request may take ~1 min to wake up.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            https://nezaleika-api.onrender.com/api/push/cron
