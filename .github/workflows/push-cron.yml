# Disabled schedule: Railway start.sh already ticks every 15m.
# workflow_dispatch only — no Actions minutes, correct Railway host.
name: Watering reminders

on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tick Railway reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.NEZALEIKA_API_URL }}
        run: |
          API_URL="${API_URL:-https://nezaleika.up.railway.app}"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            "$API_URL/api/csrf/"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_URL/api/push/cron"
