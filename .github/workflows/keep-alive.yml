name: Keep API warm

on:
  schedule:
    # Free Render sleeps ~15m without traffic — ping before that.
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render free instance
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 90 \
            "https://nezaleika-api.onrender.com/api/csrf/"
