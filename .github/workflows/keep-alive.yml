# Disabled schedule: API on Railway with in-process reminder loop.
name: Keep API warm

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake API
        env:
          API_URL: ${{ vars.NEZALEIKA_API_URL }}
        run: |
          API_URL="${API_URL:-https://nezaleika.up.railway.app}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 90 \
            "$API_URL/api/csrf/"
