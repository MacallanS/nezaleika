services:
  - type: web
    name: nezaleika-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py import_species_csv
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/csrf/
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.0'
      - key: DEBUG
        value: '0'
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: nezaleika-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://macallans.github.io
      - key: PUBLIC_BASE_URL
        value: https://macallans.github.io/nezaleika
