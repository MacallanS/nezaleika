databases:
  - name: nezaleika-db
    plan: free
    region: oregon
    databaseName: nezaleika
    user: nezaleika

services:
  - type: web
    name: nezaleika-api
    runtime: python
    region: oregon
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py import_species_csv && python manage.py ensure_household_users
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/csrf/
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.0'
      - key: DATABASE_URL
        fromDatabase:
          name: nezaleika-db
          property: connectionString
      - key: DEBUG
        value: '0'
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: nezaleika-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://macallans.github.io
      - key: PUBLIC_BASE_URL
        value: https://macallans.github.io/nezaleika
      - key: NEZALEIKA_USER_PASSWORD
        value: Nezaleika2026!
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
